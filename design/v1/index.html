      else if(act==='confirm-notification'){s.pending=s.pending.filter(x=>x.name!=='午餐');saveEntry(phone,{name:'午餐',category:'餐饮',source:'微信支付',time:'12:08',amount:28,icon:'food',kind:'支出'});}
      else if(act==='edit-notification'){s.page='add';s.amount='28.00';s.category='餐饮';s.note='午餐';renderPhone(phone)}
      else if(act==='ignore-notification'){phone.querySelector('.notification-card')?.remove();toast(phone,'已忽略，这笔消费不会计入账本')}
      else if(act==='collapse'){phone.querySelector('.notification-detail').hidden=!phone.querySelector('.notification-detail').hidden;}
      else if(act==='dismiss-modal'){phone.querySelector('.modal-backdrop')?.remove()}
      else if(act==='code'){const input=phone.querySelector('input[name="phone"]');if(!/^1\d{10}$/.test(input.value)){toast(phone,'请先输入 11 位手机号');input.focus();return}toast(phone,'演示验证码：123456，不会发送短信');}
      else if(act==='wechat'){modal(phone,'微信登录','<p>这里将跳转到微信授权登录。本设计稿仅演示入口，不会读取微信账号。</p>')}
      else if(act==='terms'||act==='privacy'){modal(phone,act==='terms'?'用户协议':'隐私政策','<p>当前为 UI 设计演示。输入内容仅用于本页交互，不会上传；真实协议将在接入服务前补齐。</p>')}
      else if(act==='help'){modal(phone,'轻松记一笔','<p>选择支出、收入或转账，输入金额和分类，点击保存。演示账目仅保留在当前页面。</p>')}
      else if(act==='account'){modal(phone,'支付账户','<p>当前演示账户为微信钱包。正式版本可选择支付宝、银行卡和现金。</p>')}
      else if(act==='date'){modal(phone,'账目日期','<p>当前演示日期：2026 年 11 月 11 日。正式版本可选择补记日期。</p>')}
      else if(act==='month'){modal(phone,'账本月份','<p>当前展示 2026 年 11 月的示例账目。正式版本可按月查看历史记录。</p>')}
      else if(act==='stat-kind'){s.statKind=button.dataset.kind;renderPhone(phone)}
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.modal-backdrop').forEach(x=>x.remove())});
    function setView(view){if(!['core','access','phone'].includes(view))view='core';document.body.dataset.view=view;document.querySelectorAll('.board-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const url=new URL(location.href);url.searchParams.set('view',view);history.replaceState(null,'',url);}
    setView(new URLSearchParams(location.search).get('view')||'core');
  </script>
</body>
</html>
